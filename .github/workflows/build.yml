name: Build unluac JAR

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Build JAR with javac
      run: |
        mkdir -p bin
        find src/unluac -name "*.java" > sources.txt
        javac -d bin @sources.txt
        jar cfe unluac.jar unluac.Main -C bin .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: unluac-jar
        path: unluac.jar
